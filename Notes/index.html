                saveBtn.style.filter = "grayscale(0%)"; saveBtn.style.background = "var(--success)"; saveBtn.style.color = "white"; saveBtn.style.borderColor = "transparent";
                setTimeout(() => { saveBtn.innerText = origIcon; saveBtn.style.filter = ""; saveBtn.style.background = ""; saveBtn.style.color = ""; saveBtn.style.borderColor = ""; }, 1500);
            }

                if (!block) return;

    // ===== INDEX: the outline of each subject (parts, chapters, headings) =====
    // A line is a heading unless it is the innermost line: a section line ("CODE N > Title:") or, in the Orders index, a RULE line.
    let indexData = {};          // code -> { leaves:[[num, from, to]], heads:[[level, name, firstLeaf, lastLeaf, extra, noPosition]], pos:Map }
    let lastCardSubject = null;
    const IX_LEAF = /^([A-Z]+) (\d+[A-Za-z]*) > (.*):$/;

    function parseIndexText(text, wordsOf, codeHint, textOf) {
        const nodes = [];
        text.replace(/^\uFEFF/, '').split(/\r\n|\n|\r/).forEach(line => {
            const m = line.match(/^(\s*)[*-]\s+(.*\S)\s*$/); if (!m) return;
            const ws = m[1]; nodes.push({ lv: (ws.match(/\t/g) || []).length + Math.floor(ws.replace(/\t/g, '').length / 2), t: m[2].trim() });
        });
        const leafNode = nodes.find(n => IX_LEAF.test(n.t));
        const orderStyle = !leafNode && nodes.some(n => n.lv === 0 && /^Order\s+\S+:/.test(n.t));
        const code = leafNode ? leafNode.t.match(IX_LEAF)[1] : codeHint;
        if (!code || (!leafNode && !orderStyle)) return null;
        const words = wordsOf(code), raw = [], heads = [];
        if (leafNode) {
            const stack = [];
            nodes.forEach(n => {
                const lm = n.t.match(IX_LEAF);
                if (lm) {
                    raw.push({ num: normNum(lm[2]), w: words[normNum(lm[2])] || 0 }); const i = raw.length - 1;
                    stack.forEach(h => { if (heads[h][2] === null) heads[h][2] = i; heads[h][3] = i; });
                } else {
                    while (stack.length && heads[stack[stack.length - 1]][0] >= n.lv) stack.pop();
                    heads.push([n.lv, n.t, null, null, '', 0]); stack.push(heads.length - 1);
                }

        } else {
            let oi = -1, curOrder = -1, sub = -1, rules = [], orderRules = {};
            const closeSub = () => { if (sub >= 0 && rules.length) { heads[sub][4] = rules.length === 1 ? `rule ${rules[0]}` : `rules ${rules[0]}–${rules[rules.length - 1]}`; heads[sub][6] = rules.length; heads[sub][8] = rules[0]; heads[sub][9] = rules[rules.length - 1]; } sub = -1; rules = []; };
            nodes.forEach(n => {

                else if (/^RULE\s/i.test(n.t)) { const lab = n.t.split('.')[0].replace(/^RULE\s+/i, '').trim(); if (curOrder >= 0) orderRules[curOrder].push(lab); if (sub >= 0) rules.push(lab); }
                else if (n.lv === 1 && oi >= 0) { closeSub(); heads.push([1, n.t, oi, oi, '', 1, 0, 0, '', '']); sub = heads.length - 1; }   // headings inside an Order: shown, never positioned by the section number

    function buildIndexes(entries, texts) {

    const kidsOf = (H, p) => { const out = []; for (let i = p + 1; i < H.length && H[i][0] > H[p][0]; i++) if (H[i][0] === H[p][0] + 1) out.push(i); return out; };

    function ixItem(code, num) {

    }
    function ixWhere(code, num) {

    // ---- the row under the header ----

    // ---- cascading menus, like the Windows context menu: hover opens the next level beside the row ----
    function closeIxMenus() { clearTimeout(ixCloseT); clearTimeout(ixOpenT); clearTimeout(ixSwitchT); ixMenus.forEach(m => m.el.remove()); ixMenus = []; document.querySelectorAll('.ix-nn.open').forEach(n => n.classList.remove('open')); }
    function closeIxFrom(level) { while (ixMenus.length > level) ixMenus.pop().el.remove(); }

    function makeIxMenu(list, level, parentRow) {

    // ===== INDEX MENU DETAILS: range, count and share of the subject for every heading =====
    const fmtPctIx = (p) => p < 0.1 ? '<0.1%' : fmtPct(p);
    function ixDetails(code, i) {
        const d = indexData[code], H = d.heads, L = d.leaves, h = H[i]; let R = '', N = 0, P = 0;
        if (d.orders) { R = h[4] || ''; N = h[6] || 0; P = (h[7] || 0) * 100; }
        else { const a = L[h[2]][0], b = L[h[3]][0]; R = a === b ? a : `${a}–${b}`; N = h[3] - h[2] + 1; P = (L[h[3]][2] - L[h[2]][1]) * 100; }

    // ===== COLLAPSIBLE CHUNKS =====
    // Orders (main face): cut at the first RULE of every heading in the index. Notes and stories: a line |||NAME||| starts a chunk.
    const CK_MARK = /^\|\|\|\s*(.+?)\s*\|\|\|\s*$/;
    const escRe = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const escHtml = (x) => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    function computeOrderChunks(text, subs) {
        if (!text || !subs.length) return null;
        const lines = text.split('\n'), at = []; let from = 0;
        for (const s of subs) {
            if (!s.rf) return null;
            const re = new RegExp('^RULE\\s+' + escRe(s.rf) + '\\.', 'i');
            let k = -1; for (let i = from; i < lines.length; i++) if (re.test(lines[i])) { k = i; break; }
            if (k === -1) return null;
            at.push(k); from = k + 1;
        }
        const clean = (arr) => arr.join('\n').replace(/^-{3,}[ \t]*\n[^\n]*\n-{3,}[ \t]*$/gm, '').replace(/\n{3,}/g, '\n\n').trim();
        const lead = clean(lines.slice(0, at[0]));
        const chunks = at.map((a, i) => { const tx = clean(lines.slice(a, i + 1 < at.length ? at[i + 1] : lines.length)); return { text: tx, words: tx ? tx.split(/\s+/).length : 0 }; });
        return { lead, chunks };
    }
    function getOpenChunks(item, faceIdx) { return new Set((appSettings.chunkOpen && appSettings.chunkOpen[`${item.subjNum}|${faceIdx}`]) || []); }
    function chunkPlan(item, faceIdx, text) {
        if (!text) return null;
        if (text.indexOf('|||') !== -1) {
            const lead = [], chunks = []; let cur = null;
            text.split('\n').forEach(l => { const m = l.match(CK_MARK); if (m) { cur = { title: m[1], lines: [] }; chunks.push(cur); } else (cur ? cur.lines : lead).push(l); });
            if (chunks.length) return { mode: 'custom', lead: lead.join('\n').trim(), chunks: chunks.map(c => { const tx = c.lines.join('\n').trim(); return { title: c.title, range: '', text: tx, words: tx ? tx.split(/\s+/).length : 0, key: c.title }; }) };
        }
        if (item && item.subjNum.startsWith('CPO ') && faceIdx === mainFace() && indexData.CPO && indexData.CPO.orders) {
            const d = indexData.CPO, H = d.heads, li = d.pos.get(normNum(item.subjNum.split(' ')[1]));
            const oi = li === undefined ? -1 : H.findIndex(h => h[0] === 0 && h[2] === li);
            const subs = oi >= 0 ? kidsOf(H, oi) : [];
            const parts = subs.length ? computeOrderChunks(text, subs.map(k => ({ rf: H[k][8] }))) : null;
            if (parts) return { mode: 'orders', lead: parts.lead, chunks: subs.map((k, j) => ({ title: H[k][1], range: H[k][4] || '', text: parts.chunks[j].text, words: parts.chunks[j].words, key: j })) };
        }
        return null;
    }
    function chunkColor(title) {
        try { applyAutoBold(''); } catch (e) { }

        return keywordColorMap[t] || keywordColorMap[t.split(/[\s:]+/)[0]] || null;
    }
    function renderCardHTML(text, item, faceIdx) {
        const plan = (item && faceIdx !== undefined) ? chunkPlan(item, faceIdx, text) : null;
        if (!plan) return renderPlainHTML(text);
        const open = getOpenChunks(item, faceIdx);
        const lead = plan.lead ? `<div class="ck-lead">${renderPlainHTML(plan.lead)}</div>` : '';
        const rows = plan.chunks.map(c => {
            const isOpen = open.has(c.key), col = plan.mode === 'custom' ? chunkColor(c.title) : null;
            return `<div class="ck ${isOpen ? '' : 'shut'} ${col ? 'ckc' : ''}" data-ck="${escHtml(c.key)}" data-mode="${plan.mode}" style="${col ? '--ln:' + col : ''}">` +
                `<div class="ck-hd" onclick="toggleChunk(this, event)" title="${escHtml(c.title)}${c.range ? ' · ' + escHtml(c.range) : ''}"><span class="ck-chv">›</span><span class="ck-tt">${escHtml(c.title)}</span>${c.range ? `<span class="ck-rg">${escHtml(c.range)}</span>` : ''}<span class="ck-sp"></span><span class="ck-wc">${c.words.toLocaleString('en-IN')}W</span></div>` +
                `<div class="ck-bw"><div class="ck-bi"><div class="ck-bt">${renderPlainHTML(c.text)}</div></div></div></div>`;
        }).join('');

    window.toggleChunk = function (hd, ev) {
        if (ev) ev.stopPropagation();
        const ck = hd.parentElement, wrap = ck.parentElement, mode = ck.dataset.mode;
        const key = mode === 'orders' ? +ck.dataset.ck : ck.dataset.ck, k = `${wrap.dataset.subj}|${wrap.dataset.face}`;

        if (mode === 'orders') { wrap.querySelectorAll('.ck').forEach(x => x.classList.add('shut')); cur.clear(); }   // one Order chunk at a time
        if (opening) { ck.classList.remove('shut'); cur.add(key); } else { ck.classList.add('shut'); cur.delete(key); }

    // ===== COPY: label, the text that is always visible, and only the open chunks =====
    function buildCopyText(item, faceIdx, code, num, everything) {
        const raw = item.faces[faceIdx] || "", head = `${code} | section ${num} | ${item.name}`;
        if (everything || document.body.classList.contains('dev-mode-on')) return `${head}\n${raw}`;
        const plan = chunkPlan(item, faceIdx, raw);
        if (!plan) return `${head}\n${raw}`;
        const open = getOpenChunks(item, faceIdx), parts = [], names = [];
        if (plan.lead) parts.push(plan.lead);
        plan.chunks.forEach(c => { if (open.has(c.key)) { const nm = c.title + (c.range ? ` (${c.range})` : ''); names.push(nm); parts.push(`${nm}:\n${c.text}`); } });
        return `${head}${names.length ? ' | ' + names.join(', ') : ''}\n${parts.join('\n\n')}`;
    }

    // ===== SKIP EMPTY: in focus mode, stepping passes over numbers where the locked subject has no section =====
    function skipActive() { return appSettings.skipEmpty === true && currentMode === 'focus' && !!globalActiveSubject; }
    function blockHasSubject(b, subj) { const mf = mainFace(); return b.items.some(i => i.subjNum.split(' ')[0] === subj && (i.faces[mf] || "").trim()); }
    function nextBlockIndex(from, dir) {
        let i = from + dir;
        if (!skipActive()) return (i >= 0 && i < parsedBlocks.length) ? i : -1;
        while (i >= 0 && i < parsedBlocks.length) { if (blockHasSubject(parsedBlocks[i], globalActiveSubject)) return i; i += dir; }
        return -1;
    }

    // ===== SETTINGS WINDOW: rows of equal weight =====
    function balancedRows(n, m) { const r = Math.ceil(n / m), base = Math.floor(n / r), extra = n % r, out = []; for (let k = 0; k < r; k++) out.push(base + (k < extra ? 1 : 0)); return out; }
    function buildSegGroup(container, name, btns, perRow, extraHtml) {
        container.innerHTML = '';
        if (!btns.length) return;
        let at = 0;
        balancedRows(btns.length, perRow).forEach((n, ri) => {
            const row = document.createElement('div'); row.className = 'srow';
            const nm = document.createElement('span'); nm.className = 'sname'; nm.innerHTML = ri === 0 ? name + (extraHtml || '') : '';
            const bar = document.createElement('div'); bar.className = 'sbar';
            btns.slice(at, at + n).forEach(b => bar.appendChild(b)); at += n;
            row.appendChild(nm); row.appendChild(bar); container.appendChild(row);
        });
    }
    function chapterCoverage(ch) {
        const mf = mainFace(), nf = notesFaceIdx(); if (nf === -1) return 0;
        let total = 0, done = 0;
        masterBlocks.forEach(b => { if (b.chapter !== ch) return; b.items.forEach(i => { const w = itemWords(i, mf); if (!w) return; total += w; if ((i.faces[nf] || "").trim()) done += w; }); });
        return total ? Math.round(100 * done / total) : 0;
    }
	function setSaveButtonState(disabled) {

        });

    function syncSmartToggleButton(side) {
        const btn = document.querySelector(`#bottom-bar-${side} .btn-expand`);
        if(!btn) return;
        const totalCards = document.querySelectorAll(`#story-cards-container-${side} .story-card`).length;
        const expandedCards = document.querySelectorAll(`#story-cards-container-${side} .story-card.expanded`).length;
        btn.innerText = (expandedCards === totalCards && totalCards > 0) ? '><' : '↕';
    }

	function smartToggleCards(side) {
        const cards = Array.from(document.querySelectorAll(`#story-cards-container-${side} .story-card`));
        const expandedCards = cards.filter(card => card.classList.contains('expanded'));
        
        const isFocusLock = currentMode === 'focus' && globalActiveSubject;
        
        // 1. ISOLATE THE SURROUNDING WORKSPACE
        // We calculate how many cards exist *excluding* your protected base
        let surroundingCardsCount = isFocusLock ? Math.max(0, cards.length - 1) : cards.length;
        let surroundingExpandedCount = 0;
        
        if (isFocusLock) {
            surroundingExpandedCount = expandedCards.filter(card => {
                const subj = card.querySelector('.story-card-header').getAttribute('data-subj');
                return subj !== globalActiveSubject;
            }).length;
        } else {
            surroundingExpandedCount = expandedCards.length;
        }

        // 2. CHECK YOUR MASTER SETTING AGAINST THE SURROUNDINGS
        let isExpanding;
        if (appSettings.isCollapseBiased) {
            // Collapse-Biased: If ANY surrounding card is open, clean it up. 
            // Only pull the rubber band if the surroundings are completely empty.
            isExpanding = (surroundingExpandedCount === 0);
        } else {
            // Expand-Biased: If ANY surrounding card is closed, open it.
            // Only snap back if the surroundings are completely full.
            isExpanding = (surroundingExpandedCount < surroundingCardsCount);
        }

        // 3. EXECUTE THE ACTION
        if (isExpanding) { 
            // PULL THE RUBBER BAND: Open everything
            cards.forEach(card => card.classList.add('expanded')); 
        } else { 
            // SNAP BACK: Close the surroundings, but protect the base
            cards.forEach(card => {
                if (isFocusLock) {
                    const subj = card.querySelector('.story-card-header').getAttribute('data-subj');
                    if (subj !== globalActiveSubject) {
                        card.classList.remove('expanded');
                    }
                } else {
                    // Normal/Study Mode: Hard reset everything
                    card.classList.remove('expanded');
                }
            });
        }
        
        syncSmartToggleButton(side);
    }

	function navigateBlock(direction) {

                    quizPointer = 0; flashRoundWatermark();
                } else quizPointer++;
            } else if (direction === -1) { if (quizPointer > 0) quizPointer--; }

	// === DYNAMIC TAXONOMY BOARD LOGIC ===
    let activeTaxChip = null;

    function loadTaxonomyBoard() {
        // Wipe existing chips but keep the Add button
        document.querySelectorAll('.chip-container').forEach(c => {
            const addBtn = c.querySelector('.add-wrapper');
            c.innerHTML = '';
            c.appendChild(addBtn);
        });

        if (!appSettings.autoBoldWords) return;

        const lines = appSettings.autoBoldWords.split('\n');
        lines.forEach(line => {
            if (!line.includes(':')) return;
            const [colors, wordsStr] = line.split(':');
            const colorParts = colors.split('|').map(c => c.trim());
            const darkHex = colorParts[0];
            
            // STRICT DELIMITER FIX: We removed the ternary check.
            // Semicolons strictly separate chips. Commas strictly separate aliases.
            let chipsData = wordsStr.split(';');

            let lane = document.querySelector(`.lane[data-color-dark="${darkHex}"]`);
            if (!lane) lane = document.querySelector('.lane');

            const container = lane.querySelector('.chip-container');
            const addWrapper = lane.querySelector('.add-wrapper');

            chipsData.forEach(chipString => {
                const words = chipString.split(',').map(w => w.trim()).filter(w => w.length > 0);
                if (words.length === 0) return;

                const primaryWord = words[0];
                const newChip = document.createElement('div');
                newChip.className = 'chip';
                newChip.setAttribute('draggable', 'true');
                newChip.setAttribute('data-aliases', words.join(', '));
                
                const countText = words.length > 1 ? ` (+${words.length - 1})` : "";
                newChip.innerHTML = `<span class="chip-text">${primaryWord}</span><span class="alias-count">${countText}</span><span class="del-btn" onclick="deleteChip(event, this)">✕</span>`;
                
                container.insertBefore(newChip, addWrapper);
            });
        });
        
        syncColorPickers();
        sortLanes();
    }

    function syncColorPickers() {
        const lanes = document.querySelectorAll('.lane');
        lanes.forEach(lane => {
            const input = lane.querySelector('.color-input');
            const color = appSettings.isDarkMode ? lane.getAttribute('data-color-dark') : lane.getAttribute('data-color-light');
            input.value = color;
            lane.style.setProperty('--lane-color', color);
        });
    }

    window.updateLaneColor = function(inputElement) {
        const lane = inputElement.closest('.lane');

        if (appSettings.isDarkMode) lane.setAttribute('data-color-dark', newColor);
        else lane.setAttribute('data-color-light', newColor);
        
        lane.style.setProperty('--lane-color', newColor);

    };

    function sortLanes() {
        document.querySelectorAll('.chip-container').forEach(container => {
            const chips = Array.from(container.querySelectorAll('.chip'));
            const addWrapper = container.querySelector('.add-wrapper');
            chips.sort((a, b) => a.querySelector('.chip-text').innerText.toLowerCase().localeCompare(b.querySelector('.chip-text').innerText.toLowerCase()));
            chips.forEach(chip => container.insertBefore(chip, addWrapper));
        });
    }

    window.saveTaxonomyBoard = function() {
        const lanes = document.querySelectorAll('.lane');
        let rawString = "";

        lanes.forEach(lane => {
            const darkHex = lane.getAttribute('data-color-dark');
            const lightHex = lane.getAttribute('data-color-light');
            const chips = lane.querySelectorAll('.chip');
            
            let laneChips = []; // Groups aliases by chip
            
            chips.forEach(chip => {
                const rawAliases = chip.getAttribute('data-aliases');
                if (rawAliases) {
                    const cleanAliases = rawAliases.split(',').map(w => w.trim()).filter(w => w.length > 0);
                    if (cleanAliases.length > 0) {
                        laneChips.push(cleanAliases.join(', '));
                    }
                }
            });
            
            if (laneChips.length > 0) {
                // Join separate chips with a semicolon
                rawString += `${darkHex}|${lightHex}: ${laneChips.join('; ')};\n`;
            }
        });

        const finalString = rawString.trim();
        if (appSettings.autoBoldWords !== finalString) {
            appSettings.autoBoldWords = finalString;
            cachedOpeningRegex = null; 
            saveSettings();
            
            isAutoBoldDirty = true;
            const statusEl = document.getElementById('auto-bold-sync-status');
            if(statusEl) { statusEl.innerText = "close to Push ⚠️"; statusEl.style.color = "var(--danger)"; }
            if (activeTab === 'story') renderStoryFocus();
        }
    };

    // UI Listeners for the Board
    document.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        const delBtn = e.target.closest('.del-btn');
        const editorBar = e.target.closest('.editor-input-bar');
        
        if (delBtn) return; 

        if (chip) {
            if (activeTaxChip) activeTaxChip.classList.remove('active');
            activeTaxChip = chip;
            activeTaxChip.classList.add('active');
            
            const editor = document.getElementById('alias-editor');
            if (editor) {
                editor.disabled = false;
                editor.value = activeTaxChip.getAttribute('data-aliases');
                editor.focus();
            }
        } else if (!editorBar) {
            if (activeTaxChip) activeTaxChip.classList.remove('active');
            activeTaxChip = null;
            const editor = document.getElementById('alias-editor');
            if (editor) { 
                editor.value = ""; 
                editor.disabled = true; 
                editor.placeholder = "Click a chip to edit its variations..."; 
            }
        }
    });

    document.getElementById('alias-editor').addEventListener('input', (e) => {
        if (!activeTaxChip) return;
        const rawVal = e.target.value;
        activeTaxChip.setAttribute('data-aliases', rawVal);
        
        const words = rawVal.split(',').map(w => w.trim()).filter(w => w.length > 0);
        const chipText = activeTaxChip.querySelector('.chip-text');
        const countSpan = activeTaxChip.querySelector('.alias-count');
        
        if (words.length > 0) {
            chipText.innerText = words[0]; 
            countSpan.innerText = words.length > 1 ? ` (+${words.length - 1})` : "";
        } else {
            chipText.innerText = "Empty"; countSpan.innerText = "";
        }
        saveTaxonomyBoard();
    });

    document.getElementById('alias-editor').addEventListener('blur', (e) => {
        if (!activeTaxChip) return;
        const cleanString = e.target.value.split(',').map(w => w.trim()).filter(w => w.length > 0).join(', ');
        e.target.value = cleanString;
        activeTaxChip.setAttribute('data-aliases', cleanString);
        saveTaxonomyBoard(); 
    });
    document.getElementById('alias-editor').addEventListener('change', () => sortLanes());

    // Drag and Drop
    let draggedChip = null;
    document.addEventListener('dragstart', (e) => {
        if (e.target.classList.contains('chip')) { draggedChip = e.target; setTimeout(() => e.target.classList.add('dragging'), 0); }
    });
    document.addEventListener('dragend', (e) => {
        if (e.target.classList.contains('chip')) {
            e.target.classList.remove('dragging'); draggedChip = null;
            sortLanes(); saveTaxonomyBoard(); 
        }
    });
    document.querySelectorAll('.chip-container').forEach(container => {
        container.addEventListener('dragover', (e) => {
            e.preventDefault(); 
            const addWrapper = container.querySelector('.add-wrapper');
            container.insertBefore(draggedChip, addWrapper);
        });
    });

    // CRUD Mechanics
    window.deleteChip = function(event, delBtnElement) {
        event.stopPropagation(); 
        const chip = delBtnElement.parentElement;
        if (chip === activeTaxChip) {
            activeTaxChip = null;
            const editor = document.getElementById('alias-editor');
            editor.value = ""; editor.disabled = true;
        }
        chip.remove();
        saveTaxonomyBoard();
    };

    window.showInput = function(btnElement) {
        const wrapper = btnElement.parentElement;
        const input = wrapper.querySelector('.inline-input');
        btnElement.style.display = 'none'; input.style.display = 'block'; input.focus();
    };

    window.handleInputKey = function(e, inputElement) {
        if (e.key === 'Enter') { e.preventDefault(); inputElement.blur(); }
        if (e.key === 'Escape') { inputElement.value = ""; inputElement.blur(); }
    };

    window.handleInputComplete = function(inputElement) {
        const wrapper = inputElement.parentElement;
        const container = wrapper.parentElement;
        const btn = wrapper.querySelector('.add-btn');
        const newText = inputElement.value.trim();
        
        if (newText !== "") {
            let allExistingWords = [];
            document.querySelectorAll('.chip').forEach(chip => {
                const aliases = chip.getAttribute('data-aliases').split(',').map(w => w.trim().toLowerCase());
                allExistingWords = allExistingWords.concat(aliases);
            });
            
            if (allExistingWords.includes(newText.toLowerCase())) {
                inputElement.style.backgroundColor = 'rgba(231, 76, 60, 0.2)';
                inputElement.style.borderColor = '#e74c3c';
                setTimeout(() => { inputElement.style.backgroundColor = 'var(--bg-card)'; inputElement.style.borderColor = 'var(--lane-color)'; }, 400);
                inputElement.focus(); return; 
            }

            const newChip = document.createElement('div');
            newChip.className = 'chip';
            newChip.setAttribute('draggable', 'true');
            newChip.setAttribute('data-aliases', newText);
            newChip.innerHTML = `<span class="chip-text">${newText}</span><span class="alias-count"></span><span class="del-btn" onclick="deleteChip(event, this)">✕</span>`;
            
            container.insertBefore(newChip, wrapper);
            sortLanes(); saveTaxonomyBoard();
        }
        
        inputElement.value = ""; inputElement.style.display = 'none'; btn.style.display = 'flex';
    };

    // Override the Bootloader Hook
    const originalApplySavedSettings = applySavedSettingsToUI;
    window.applySavedSettingsToUI = function() {
        originalApplySavedSettings();
        // Disconnect the old textarea setting sync
        const oldTextarea = document.getElementById('setting-auto-bold');
        if (oldTextarea) oldTextarea.remove(); 
        
        loadTaxonomyBoard();
    };
</script>
</body>
</html>
