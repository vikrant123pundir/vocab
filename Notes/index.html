<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no">
	<title>District Learner - Core Editor v13</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <style>
:root { 
            --bg-main: #f4f5f7; --bg-card: #ffffff; --primary: #2c3e50; --accent: #3498db; --text-main: #333; --text-light: #7f8c8d; --border: #e0e6ed; --success: #2ecc71; --danger: #e74c3c; 
            
            /* Isolated Light Theme Elements */
            --bg-topbar: #ecf0f1;
            --bg-content: #fafbfc;
            --tr-active: #f0f0f5;
            --btn-bg: #ecf0f1;
			--btn-border: transparent;
            --quote-bg: rgba(52, 152, 219, 0.05);
            --quote-text: #555;
            --edit-bg: rgba(52, 152, 219, 0.02);
            --ghost-circle-border: rgba(44, 62, 80, 0.15);
            --ghost-circle-text: rgba(44, 62, 80, 0.5);
            --nav-btn-text: rgba(44, 62, 80, 0.35);
            --nav-btn-border: rgba(44, 62, 80, 0.15);
            --nav-btn-hover-bg: rgba(44, 62, 80, 0.05);
            --nav-btn-active-text: rgba(44, 62, 80, 0.8);
            --nav-btn-active-border: rgba(44, 62, 80, 0.3);
            --badge-bg: var(--primary); /* Keeps light theme identical */
            --badge-text: white;        /* Keeps light theme identical */
            --badge-border: transparent;
			--section-title: var(--primary);
        }
		
		body.dark-theme {
            --bg-main: #121212; 
            --bg-card: #1f1f1f; 
            --primary: #999999; 
            --accent: #5c8bbf; 
            --text-main: #dcddde; 
            --text-light: #8b8b8b; 
            --border: #363636; 
            --bg-topbar: #202020;
            --bg-content: #0d0d0d;
            --tr-active: #323232;
            --btn-bg: #2a2a2a;
			--btn-border: #444444;
            --quote-bg: rgba(52, 152, 219, 0.1);
            --quote-text: #cbd5e1;
            --edit-bg: rgba(255, 255, 255, 0.02);
            --ghost-circle-border: #363636;
            --ghost-circle-text: #7a7a7a;
            --nav-btn-text: #7a7a7a;
            --nav-btn-border: #838383;
            --nav-btn-hover-bg: #323232;
            --nav-btn-active-text: #dcddde;
            --nav-btn-active-border: #555555;
            --badge-bg: var(--btn-bg);       /* Matches dark settings chips */
            --badge-text: #cbd5e1;           /* Crisp light text */
            --badge-border: var(--btn-border); /* Matches dark settings borders */
			--section-title: #ffffff;
        }
		
        * { -ms-overflow-style: none; scrollbar-width: none; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        *::-webkit-scrollbar { display: none; }
        button { outline: none; }
        
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-main); color: var(--text-main); overflow: hidden; touch-action: manipulation; }
        
        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; overflow-x: hidden; }
        
        /* === SLEEK, THIN FIXED-HEIGHT TOP BAR === */
        #top-status-bar { 
            background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; 
            flex-shrink: 0; z-index: 1000; transition: all 0.2s ease; 
            height: calc(65px + env(safe-area-inset-top)); 
            padding: 0; padding-top: env(safe-area-inset-top); 
            width: 100%; position: relative; overflow: hidden;
        }
        
        #top-status-bar.header-mode, 
        #top-status-bar.story-header-mode { background: var(--bg-topbar); color: var(--primary); border-bottom: 2px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #quiz-progress { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--success); width: 0%; transition: width 0.3s ease; }

        /* === MINIMALIST GHOST WATERMARK === */
        #round-flash { 
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 2.2rem; font-weight: 900; 
            color: rgba(44, 62, 80, 0.2); background: transparent; pointer-events: none; opacity: 0; z-index: 3000; 
            transition: opacity 0.5s ease, transform 0.8s ease-out; text-align: center; white-space: nowrap; letter-spacing: 10px;
        }
        #round-flash.flash-active { opacity: 1; transform: translate(-50%, -60%); }

        .hdr-col { font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; transition: opacity 0.2s; user-select: none; }
        .interactive-hdr { cursor: pointer; }
        .interactive-hdr:active { opacity: 0.5; }
        #app.hide-words #hdr-words { opacity: 0.4; text-decoration: line-through; }

        .story-hdr-text { font-size: 1.1rem; line-height: 1.1; transition: font-size 0.2s; text-align: center; }
        .story-hdr-text.sm { font-size: 0.95rem; }
        .story-hdr-text.xs { font-size: 0.80rem; }

        /* HEADER CIRCLES */
        .top-ghost-circle { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--ghost-circle-border); color: var(--ghost-circle-text); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.85rem; pointer-events: none; transition: all 0.2s ease; }
		.top-ghost-circle.hidden { opacity: 0; }
        
        .interactive-circle { pointer-events: auto; cursor: pointer; }
        .interactive-circle:hover { background-color: rgba(44, 62, 80, 0.08); color: var(--primary); }
        .interactive-circle:active { transform: scale(0.9); }

        /* === DYNAMIC ABSOLUTE VIEW STACK === */
        #view-stack { position: relative; flex: 1; width: 100vw; overflow: hidden; background: var(--bg-main); }

        .view-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow-y: auto; padding-bottom: 0; will-change: transform; background: var(--bg-main);
            display: none;
        }
        
        body.view-table #view-table { display: block; }
        body.view-story #view-story { display: flex; }
        
        /* === TABLE VIEW === */
        table { width: 100%; border-collapse: collapse; text-align: left; background: var(--bg-card); table-layout: fixed; }
        td { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 1.05rem; transition: opacity 0.2s; }
        tr { cursor: pointer; transition: background 0.1s; background: var(--bg-card); }
        tr:active { background: var(--tr-active); }
        tr:last-child td { border-bottom: none; }
        
        .col-num { width: 12%; padding-left: 20px; }
        .col-wrd { width: 88%; padding-right: 20px; text-align: right; }
        .td-num { font-weight: 900; color: var(--accent); }
        .td-word { font-weight: 800; color: var(--primary); }
		.td-focus-word { font-weight: 700; font-size: 1rem; line-height: 1.4; color: var(--primary); transition: opacity 0.2s; text-align: left; }
        #app.hide-words .td-word, #app.hide-words .td-focus-word { opacity: 0; }

        /* === DUAL PANE STORY FOCUS VIEW === */
        #view-story { flex-direction: row; width: 100vw; height: 100%; overflow: hidden; }
		.split-pane { height: 100%; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        #pane-left { flex: 1; }
        #pane-right { display: none; }
        
        /* DRAGGABLE PANE DIVIDER */
        .pane-divider { position: relative; width: 4px; background: var(--border); cursor: col-resize; display: none; transition: background 0.2s; z-index: 100; }
        .pane-divider::after { content: ''; position: absolute; top: 0; left: -8px; right: -8px; bottom: 0; cursor: col-resize; z-index: 101; }
        .pane-divider:hover, .pane-divider.dragging { background: var(--accent); }
        
        body.dual-pane #pane-left { flex: 0 0 var(--desktop-split, 50%); }
        body.dual-pane #pane-right { flex: 0 0 calc(100% - var(--desktop-split, 50%)); display: flex; border-left: 1px solid var(--border); }
        body.dual-pane #pane-divider { display: block; }
        
        .story-scroll-area { flex: 1; overflow-y: auto; padding: 15px; }

        .story-card { background: var(--bg-card); border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); overflow: hidden; transition: outline 0.2s ease; }
        
        .story-card-header { padding: 16px 15px; display: flex; align-items: flex-start; cursor: pointer; user-select: none; background: var(--bg-card); transition: background-color 0.2s; position: relative; }
		.story-center-header { cursor: copy; transition: opacity 0.15s ease; }

        .subj-badge { background: var(--badge-bg); color: var(--badge-text); border: 1px solid var(--badge-border); font-weight: 900; font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; margin-right: 12px; white-space: nowrap; pointer-events: none; }
		.section-name { font-weight: 700; font-size: 1rem; line-height: 1.4; color: var(--section-title); flex: 1; pointer-events: none; padding-right: 30px; /* leaves room for the ghost indicator */ }
		
        /* THE GHOST FACE INDICATOR */
        .face-indicator {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(200, 60, 60, 0.5); 
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
            opacity: 0;
            pointer-events: none; /* Let clicks pass right through it */
            transition: none;
        }
        .story-card.out-of-sync .face-indicator { opacity: 1; }

		.story-content { padding: 0 15px; max-height: 0; overflow: hidden; visibility: hidden; transition: max-height 0.3s ease, padding 0.3s ease, visibility 0s 0.3s; background: var(--bg-content); border-top: 1px solid transparent; }
		.story-card.expanded .story-content { max-height: 25000px; padding: 5px 15px 20px 15px; visibility: visible; transition: max-height 0.3s ease, padding 0.3s ease, visibility 0s 0s; border-top-color: var(--border); }
		
        /* BUG FIX 1: Prevent Ghost Selection in closed cards */
        .story-card:not(.expanded) .story-content {
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
        }
		
/* === MINIMAL MARKDOWN STYLING === */
        .story-read-view { margin: 10px 0; line-height: 1.5; font-size: 1rem; color: var(--text-main); overflow-wrap: break-word; word-break: break-word; }
        
        .story-read-view p { font-size: 0.95rem; margin-top: 10px; margin-bottom: 10px; }
        .story-read-view p:last-child { margin-bottom: 0; }

        .story-read-view h1, .story-read-view h2, .story-read-view h3, .story-read-view h4, .story-read-view h5, .story-read-view h6 { 
            font-size: 0.8rem; font-weight: 800; color: var(--primary); margin: 12px 0 4px 0; text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        .story-read-view ul, .story-read-view ol { margin: 4px 0 8px 0; padding-left: 30px; list-style-position: outside; list-style-type: none; }
        .story-read-view ul ul, .story-read-view ol ol { margin: 4px 0 0 0; padding-left: 30px; }
		.story-read-view ul ul ul { margin: 4px 0 0 0; padding-left: 30px; }
		.story-read-view ul ul ul ul { margin: 4px 0 0 0; padding-left: 30px; }
		.story-read-view li { margin-bottom: 4px; }
        
        .story-read-view blockquote { 
            border-left: 3px solid var(--accent); 
            padding: 6px 12px; 
            color: var(--quote-text); 
            background: var(--quote-bg);
            margin: 12px 0 4px 0; 
            border-radius: 0 4px 4px 0;
            font-style: normal;
            font-size: 0.95rem;
            line-height: 1.4;
            transition: all 0.2s ease;
        }

        .story-read-view blockquote p { margin: 0 !important; font-weight: normal; }
        .story-read-view blockquote + p { margin-top: 2px; }
		
		
		/* === INVISIBLE E-READER TAP ZONES === */
        .edge-tap-zone { position: absolute; top: 65px; bottom: 110px; width: 40px; z-index: 200; }
        body.any-edit-mode-active .edge-tap-zone { bottom: 210px; }
		#tap-zone-prev { left: 0; }
        #tap-zone-next { right: 0; }
        
        body:not(.view-story) .edge-tap-zone { display: none !important; }
        body.hide-edge-taps .edge-tap-zone { display: none !important; }

        /* === EDIT MODE LOGIC === */
        .editor-zone { display: none; flex-direction: column; gap: 10px; margin-top: 15px; border-top: 1px dashed var(--border); padding-top: 15px; }
        body.dev-mode-on .editor-zone { display: flex; }
        
        .split-pane.edit-mode-active .story-read-view { display: none; }
        .split-pane.edit-mode-active .edit-story-box { display: block !important; }
        .split-pane.edit-mode-active .story-card { border-color: var(--accent); }
        
		.edit-story-box { display: none; width: 100%; min-height: 120px; border: 2px dashed var(--accent); border-radius: 8px; padding: 10px; font-family: inherit; font-size: 1rem; color: var(--text-main); resize: vertical; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.1); box-sizing: border-box; transition: background-color 0.3s, border-color 0.3s; background: var(--edit-bg); }
        
		/* === NAVIGATION DOCK === */
        .pane-bottom-bar { position: absolute; bottom: 15px; left: 15px; right: 15px; height: 40px; pointer-events: none; z-index: 500; }
        .pane-bottom-bar > * { pointer-events: auto; }

        .nav-btn-base { 
            position: absolute; bottom: 0; height: 40px; background: transparent; color: var(--nav-btn-text); 
            border: 1px solid var(--nav-btn-border); box-shadow: none; display: flex; align-items: center; justify-content: center; 
            font-size: 1.1rem; cursor: pointer; transition: all 0.2s ease; 
        }
        .nav-btn-base:active:not(:disabled) { background: var(--nav-btn-hover-bg); color: var(--nav-btn-active-text); border-color: var(--nav-btn-active-border); transform: scale(0.95); }
        .nav-btn-base:disabled { color: rgba(44, 62, 80, 0.1); border-color: rgba(44, 62, 80, 0.05); cursor: not-allowed; }

        .btn-settings { left: 0; width: 40px; border-radius: 50%; }
        .btn-dev { right: 0; width: 40px; border-radius: 50%; font-size: 1.3rem; transition: all 0.3s ease; }

        .pill-btn { border-radius: 20px; font-weight: 800; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }
        .btn-view { left: 45px; width: calc(50% - 50px); color: var(--primary); border-color: rgba(44, 62, 80, 0.3); }
        .btn-face { right: 45px; width: calc(50% - 50px); color: var(--primary); border-color: rgba(52, 152, 219, 0.4); background: rgba(52, 152, 219, 0.05); }

        .right-stack-btn { right: 0; width: 40px; border-radius: 50%; position: absolute; transition: all 0.2s ease; filter: grayscale(100%); opacity: 0.6; display: flex; align-items: center; justify-content: center; }
        .right-stack-btn:hover, .right-stack-btn:active { filter: grayscale(0%); opacity: 1; }

		.box-1 { bottom: 55px; }
        .box-2 { bottom: 105px; }
        .box-3 { bottom: 155px; }

        /* BINARY MODE LOGIC */
        body:not(.dev-mode-on) .btn-expand { display: flex !important; }
        body:not(.dev-mode-on) .right-stack-btn:not(.btn-expand):not(.btn-target) { display: none !important; }
        body:not(.dev-mode-on) .btn-target { bottom: 105px; } /* Slides down above expand button when normal */

        body.dev-mode-on .btn-expand { display: none !important; }
        body.dev-mode-on .btn-save,
        body.dev-mode-on .btn-reset,
        body.dev-mode-on .btn-target { display: flex !important; }
        body.dev-mode-on .btn-target { bottom: 155px; } /* Slides up to position 3 when save/reset appear */

        body.view-story #table-bottom-bar { display: none; }
        body.view-table #table-bottom-bar { display: block; }
        body.view-table .pane-bottom-bar:not(#table-bottom-bar) { display: none !important; }

        /* 1. Hardware Detection: UI elements ignore screen width and check input type */
        @media (pointer: coarse) { 
            .desktop-only { display: none !important; } 
        }
        @media (pointer: fine) {
            .mobile-only { display: none !important; }
        }

        /* 2. Structural Safeguard: Prevents Dual-Pane reading text from being crushed on narrow windows */
        @media (max-width: 1024px) { 
            body.dual-pane #pane-left { flex: 1 !important; border-right: none !important; }
            body.dual-pane #pane-right { display: none !important; }
            body.dual-pane #pane-divider { display: none !important; }
        }
        @media (min-width: 768px) and (pointer: fine) { 
            .story-scroll-area { padding: 30px; padding-bottom: 40px; } 
            body.dev-mode-on .desktop-only { display: flex !important; } 
        }

        /* === MODALS (Minimalist Redesign) === */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
        .modal-box { background: var(--bg-card); padding: 20px; border-radius: 16px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
		.modal-box h3 { margin: 0 0 5px 0; color: var(--primary); font-size: 1rem; border-bottom: 2px solid var(--border); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .mode-selector { display: flex; background: var(--btn-bg); border-radius: 10px; overflow: hidden; margin-bottom: 10px; border: 1px solid var(--btn-border); }
		.mode-selector input[type="radio"] { display: none; }
        .mode-label { flex: 1; text-align: center; padding: 10px 0; font-weight: 800; font-size: 0.85rem; color: var(--primary); cursor: pointer; transition: background 0.2s, color 0.2s; border-right: 1px solid var(--btn-border); }
		.mode-label:last-child { border-right: none; }
        .mode-selector input[type="radio"]:checked + .mode-label { background: var(--primary); color: white; }
        
        #chapter-tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; max-height: 30vh; overflow-y: auto; padding-right: 4px; border-radius: 8px; align-content: flex-start; }
        #chapter-tags-container::-webkit-scrollbar { display: block; width: 4px; }
        #chapter-tags-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
		.tag-btn { background: var(--btn-bg); border: 2px solid var(--btn-border); color: var(--text-light); padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: all 0.2s ease; }
		.tag-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .tag-btn:active { transform: scale(0.95); }

        .settings-list { display: flex; flex-direction: column; gap: 12px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; color: var(--text-main); padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .setting-item:last-child { border-bottom: none; }
        
        .setting-item.col-flex { flex-direction: column; align-items: flex-start; gap: 8px; }
        .setting-row-inner { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        
        .setting-item input[type="range"] { width: 120px; accent-color: var(--primary); }
        .setting-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); }
		
		/* --- DYNAMIC TAXONOMY BOARD (COMPACT UI) --- */
        .lane { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); min-height: 28px; }
        .lane:last-child { border-bottom: none; }
        
        .color-input { width: 20px; height: 20px; border: none; padding: 0; cursor: pointer; border-radius: 4px; background: transparent; flex-shrink: 0; margin-top: 2px; }
        .color-input::-webkit-color-swatch-wrapper { padding: 0; }
        .color-input::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 4px; }
        
        .chip-container { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; align-items: center; min-height: 24px; }
        
        .chip { background-color: color-mix(in srgb, var(--lane-color) 15%, transparent); color: var(--lane-color); border: 1px solid transparent; padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; cursor: grab; display: inline-flex; align-items: center; gap: 4px; user-select: none; }
        .chip:active { cursor: grabbing; }
        .chip.dragging { opacity: 0.5; transform: scale(0.95); }
        .chip.active { border: 1px solid var(--text-main); }
        .alias-count { font-size: 0.65rem; opacity: 0.7; font-weight: 900; }
        
        .del-btn { opacity: 0; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        .chip:hover .del-btn { opacity: 0.6; }
        .del-btn:hover { opacity: 1 !important; color: var(--text-main); }
        
        .add-wrapper { display: flex; align-items: center; }
        .add-btn { background: transparent; border: 1px dashed var(--border); color: var(--text-main); opacity: 0.5; border-radius: 4px; padding: 0px 8px; height: 20px; font-size: 0.85rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .add-btn:hover { opacity: 1; }
        .inline-input { display: none; background: var(--bg-card); border: 1px solid var(--lane-color); color: var(--text-main); padding: 0px 6px; border-radius: 4px; height: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; outline: none; width: 90px; }
        
		.editor-input-bar { width: 100%; margin-top: 10px; background: color-mix(in srgb, var(--bg-card) 96%, var(--text-main)); border: 1px dashed var(--border); color: var(--text-main); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; outline: none; transition: border 0.2s, background 0.2s; box-sizing: border-box; }
        .editor-input-bar:focus { border: 1px solid var(--accent); background: var(--bg-card); }
        .editor-input-bar:disabled { opacity: 0.4; cursor: not-allowed; background: transparent; }
		
		/* --- REUSE MODE SELECTOR FOR SETTINGS TOGGLES --- */
        button.mode-label { background: transparent; border-top: none; border-bottom: none; border-left: none; outline: none; font-family: inherit; padding: 8px 0; font-size: 0.75rem; line-height: 1.2; }
        button.mode-label.active { background: var(--primary); color: white; }
        /* Force toggle buttons to stretch horizontally */
        button.toggle-btn { flex: 1; border-right: 1px solid var(--btn-border); font-weight: 800; color: var(--primary); cursor: pointer; transition: background 0.2s, color 0.2s; }
        button.toggle-btn:last-child { border-right: none; }

<script>
    marked.use({ breaks: true, gfm: true }); 
    // The GitHub token is NOT stored in this file. It is asked once and kept only in this browser
    // (same key as the map app, so one token serves both pages on the same site).
    const TOKEN_KEY = "geo_gh_token";
    let GITHUB_TOKEN = localStorage.getItem(TOKEN_KEY) || "";
    if (!GITHUB_TOKEN) {
        const t = prompt("GitHub token with access to the vocab repo (kept only in this browser):");
        if (t && t.trim()) { GITHUB_TOKEN = t.trim(); localStorage.setItem(TOKEN_KEY, GITHUB_TOKEN); }
    }
    const AUTH = GITHUB_TOKEN ? { "Authorization": `token ${GITHUB_TOKEN}` } : {};
    const REPO_API = "https://api.github.com/repos/vikrant123pundir/vocab";
    let NOTES_ROOT = "Notes"; let MAPS_ROOT = "Geography_quiz";
    let NOTES_API = REPO_API + "/contents/" + NOTES_ROOT;

	// NEW VERSION EXTRACTION LOGIC
    let APP_VERSION = "v13";   // used when the file name has no number (index.html) 
	// Decode the URL to turn %20 back into normal spaces before reading the version
    const cleanPath = decodeURIComponent(window.location.pathname);
    const versionMatch = cleanPath.match(/([\d.]+)\.html/i);
    
    if (versionMatch) {
        APP_VERSION = "v" + versionMatch[1];
    }

    document.addEventListener('DOMContentLoaded', () => {
        const statusText = document.getElementById('status-text');
        if (statusText) statusText.innerText = `☁️ Booting ${APP_VERSION}...`;
        
        // Push the v<number> format to all header tags
        document.querySelectorAll('.version-display').forEach(el => {
            el.innerText = APP_VERSION;
        });
    });
	
	const DEFAULT_SETTINGS = {
        mode: 'normal',
        defaultView: 'table',
        basketName: 'basket_1', 
        activeChaptersByBasket: {},
        notchOffset: 0,
        desktopSplit: 50,
        isDualPane: false,

	// The GPS Router: Maps out the exact sequence of blocks and subjects to be read
    function generateReadingPath(startIndex, startMode, startSubj) {
        let path = [];
        
        if (startMode === 'focus' && startSubj) {
            // 1. Identify the exact order of subjects currently active in the State Chips
            let subjectOrder = [];
            parsedBlocks.forEach(b => {
                b.items.forEach(item => {
                    if (!appSettings.showNoneSubjects && item.name.trim().toUpperCase() === 'NONE') return;
                    let code = item.subjNum.split(' ')[0] || "LAW";
                    if (!subjectOrder.includes(code)) subjectOrder.push(code);
                });
            });
            
            let currentSubjIdx = subjectOrder.indexOf(startSubj);
            if (currentSubjIdx === -1) currentSubjIdx = 0;
            
            // 2. Route Path 1: Current subject, from where you are right now to the end of the state chips
            for (let i = startIndex; i < parsedBlocks.length; i++) {
                path.push({ blockIdx: i, subj: subjectOrder[currentSubjIdx] });
            }
            
            // 3. Route Path 2: All subsequent subjects, looping back to block 0 for each new subject
            for (let s = currentSubjIdx + 1; s < subjectOrder.length; s++) {
                for (let i = 0; i < parsedBlocks.length; i++) {
                    path.push({ blockIdx: i, subj: subjectOrder[s] });
                }
            }
        } else {
            // Normal mode routing: Read block by block, all subjects simultaneously
            for (let i = startIndex; i < parsedBlocks.length; i++) {
                path.push({ blockIdx: i, subj: null });
            }
        }
        return path;
    }

    // Evaluates the word count for a specific step on the GPS route
    function countWordsForStep(step) {
        let count = 0;
        let lastSection = "";
        const block = parsedBlocks[step.blockIdx];
        if (!block || !block.items) return { count, lastSection };
        
        block.items.forEach(item => {
            if (!appSettings.showNoneSubjects && item.name.trim().toUpperCase() === 'NONE') return;
            const subjCode = item.subjNum.split(' ')[0] || "LAW";
            if (step.subj !== null && subjCode !== step.subj) return;
            
            const rawText = item.faces[mainFace()] || item.faces[0] || "";
            if (rawText) {
                count += rawText.split(/\s+/).filter(w => w.length > 0).length;
                lastSection = item.subjNum;
            }
        });
        return { count, lastSection };
    }

    window.updateGlobalWordCount = function(side) {
        let totalWords = 0;
        const container = document.getElementById(`story-cards-container-${side}`);
        if (!container) return;
        
        // 1. Isolate Word Count for the active view
        const targetBoxes = (currentMode === 'focus' && globalActiveSubject) 
            ? container.querySelectorAll('.story-card.expanded .edit-story-box') 
            : container.querySelectorAll('.edit-story-box');
            
        targetBoxes.forEach(box => {
            const text = box.value.trim();
            if (text) totalWords += text.split(/\s+/).length;
        });

        const wcDisp = document.querySelector(`#bottom-bar-${side} .wc-disp-${side}`);
        const pillBtn = document.querySelector(`#bottom-bar-${side} .btn-face`);
        
        // 2. Render Target Tracker or Default Pill
        if (dailyTargetActive) {
            if (wcDisp) wcDisp.innerText = `| 🎯 ${targetSectionName}`;
            
            const path = generateReadingPath(dailyTargetParams.startIndex, dailyTargetParams.mode, dailyTargetParams.subj);
            
            // Locate the user's current physical position on the GPS route
            let currentStepIndex = -1;
            for (let p = 0; p < path.length; p++) {
                const step = path[p];
                if (dailyTargetParams.mode === 'focus') {
                    if (step.blockIdx === currentBlockIndex && step.subj === globalActiveSubject) {
                        currentStepIndex = p;
                        break;
                    }
                } else {
                    if (step.blockIdx === currentBlockIndex) {
                        currentStepIndex = p;
                        break;
                    }
                }
            }
            
            // Tally the words read so far based on their position on the route
            let currentWordsRead = 0;
            if (currentStepIndex === -1) {
                currentWordsRead = 0; // Navigated completely off the path
            } else if (currentStepIndex > dailyTargetParams.targetStepIndex) {
                currentWordsRead = totalTargetWords; // Passed the target
            } else {
                for (let p = 0; p < currentStepIndex; p++) {
                    currentWordsRead += countWordsForStep(path[p]).count;
                }
            }
            
            let progress = 0;
            if (totalTargetWords > 0) progress = Math.min((currentWordsRead / totalTargetWords) * 100, 100);
            
            if (pillBtn) {
                pillBtn.style.background = `linear-gradient(to right, rgba(46, 204, 113, 0.25) ${progress}%, rgba(52, 152, 219, 0.05) ${progress}%)`;
                pillBtn.style.borderColor = `rgba(46, 204, 113, 0.4)`;
            }
        } else {
            if (wcDisp) wcDisp.innerText = `| ${totalWords}W`;
            if (pillBtn) {
                pillBtn.style.background = `rgba(52, 152, 219, 0.05)`;
                pillBtn.style.borderColor = `rgba(52, 152, 219, 0.4)`;
            }
        }
    };

    window.toggleDailyTarget = function() {
		if (currentMode !== 'focus') return;
        if (dailyTargetActive) {
            // Turn OFF & Reset
            dailyTargetActive = false;
            dailyTargetParams = {};
            targetSectionName = "";
            totalTargetWords = 0;
            
            const flash = document.getElementById('round-flash');
            if (flash) {
                flash.innerText = `TARGET CLEARED`;

                setTimeout(() => { flash.classList.remove('flash-active'); }, 1200);
            }
            
            ['left', 'right'].forEach(side => updateGlobalWordCount(side));
            return;
        }

        // Turn ON & Calculate Look-Ahead Route
        if (parsedBlocks.length === 0) return;
        
        dailyTargetActive = true;
        dailyTargetParams = {
            startIndex: currentBlockIndex,
            mode: currentMode,
            subj: globalActiveSubject
        };
        
        const path = generateReadingPath(currentBlockIndex, currentMode, globalActiveSubject);
        
        let accumulatedWords = 0;
        const GOAL = appSettings.dailyTargetGoal || 3000;
        let closestDiff = Infinity;
        let targetStepIndex = 0;
        
        // Walk the path step-by-step to find the nearest round-off to 3,000 words
        for (let p = 0; p < path.length; p++) {
            const stepResult = countWordsForStep(path[p]);
            if (stepResult.count === 0) continue; // Skip empty blocks
            
            accumulatedWords += stepResult.count;
            let diffAfter = Math.abs(accumulatedWords - GOAL);
            
            if (diffAfter < closestDiff) {
                closestDiff = diffAfter;
                targetStepIndex = p;
                targetSectionName = stepResult.lastSection; 
            }

            if (accumulatedWords >= GOAL) {
                break; // Target crossed, end look-ahead
            }
        }
        
        dailyTargetParams.targetStepIndex = targetStepIndex;
        
        // Calculate exact total words up to the determined target point
        totalTargetWords = 0;
        for (let p = 0; p <= targetStepIndex; p++) {
            totalTargetWords += countWordsForStep(path[p]).count;
        }
        if (totalTargetWords === 0) totalTargetWords = 1; // Prevent Div by 0
        
        if (!targetSectionName) targetSectionName = "END";
        
        // Visual Notification
        const flash = document.getElementById('round-flash');
        if (flash) {
            flash.innerText = `🎯 TARGET: ${targetSectionName}`;
            flash.classList.add('flash-active');
            setTimeout(() => { flash.classList.remove('flash-active'); }, 1500);
        }

        ['left', 'right'].forEach(side => updateGlobalWordCount(side));
    };

        const headerRegex = /^.*?\|.*?\|[^\n]*\r?\n?/;
        
        if (headerRegex.test(paste)) {

            e.preventDefault(); 
            
            // Delete that first line and trim any leftover blank space at the top

            // Insert the clean text exactly where your cursor is blinking

            textarea.value = textarea.value.substring(0, start) + cleanText + textarea.value.substring(end);

        }
    };	
	
// === COLOR-AWARE AUTO-BOLD & KEYWORD ENGINE ===
    let keywordColorMap = {}; 
    let cachedOpeningRegex = null;
    let lastBoldWords = null;

	window.applyAutoBold = function(text) {
        if (!text) return text;
        
        const lines = text.split(/\r?\n/);
        let processedLines = [];
        let inList = false;
        let inBlockquote = false;

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i];
            let isEmpty = line.trim() === '';

            if (isEmpty) {
                inBlockquote = false;
                inList = false;
                processedLines.push(line);
                continue;
            }

            // 1. Detect if we are inside a blockquote colored box
            if (/^\s*>/.test(line)) {
                inBlockquote = true;
            }

            // 2. Identify Lists
            let isListItem = /^[ \t]*(?:>\s*)?[-*]\s+/.test(line);
            let isIndented = /^[ \t]*(?:>\s*)?[ \t]+/.test(line);

            // 3. Apply the Custom Variant Logic
            if (isListItem) {
                inList = true;
                // Auto-inject ">" ONLY on bullet points to sustain the box
                if (inBlockquote && !/^\s*>/.test(line)) {
                    line = '> ' + line;
                }
                processedLines.push(line);
            } else if (inList && !isIndented) {
                // LIST BREAKER: We exited a list. Markdown REQUIRES a blank line here to stop indentation.
                processedLines.push(inBlockquote ? '>' : ''); 
                
                // To safely restart the lazy box after a break, this specific line gets a ">"
                if (inBlockquote && !/^\s*>/.test(line)) {
                    line = '> ' + line;
                }
                processedLines.push(line);
                inList = false;
            } else {
                // Normal paragraphs ("sample line") are left alone for lazy continuation
                processedLines.push(line);
            }
        }

        let sanitizedText = processedLines.join('\n');
        if (!appSettings.autoBoldWords) return sanitizedText;
        
        if (lastBoldWords !== appSettings.autoBoldWords || !cachedOpeningRegex) {
            keywordColorMap = {};
            let flatWords = [];
            
            // BUG FIX: Only split the main string on newlines, NOT semicolons
            const settingLines = (appSettings.autoBoldWords || "").split('\n');
            settingLines.forEach(line => {
                if (!line.trim()) return;
                
                const match = line.match(/^([^:]+)\s*:\s*(.*)/i);
                if (match) {
                    const colorValRaw = match[1].trim();
                    const colorParts = colorValRaw.split('|');
                    const darkColor = colorParts[0].trim();
                    const lightColor = colorParts.length > 1 ? colorParts[1].trim() : darkColor; 
                    const finalColor = appSettings.isDarkMode ? darkColor : lightColor;

                    const wordsPart = match[2];
                    
                    // Allow the highlighting engine to read both chips (;) and aliases (,)
                    const words = wordsPart.split(/[;,]+/).map(w => w.trim()).filter(w => w.length > 0);
					words.forEach(w => {
                        keywordColorMap[w.toLowerCase()] = finalColor;
                        flatWords.push(w.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
                    });
                }
            });
            
            if (flatWords.length > 0) {
                flatWords.sort((a, b) => b.length - a.length);
                const wordsRegex = flatWords.join('|');
                
                // NEW: Added [\\*]* before and [\\*:]* after the word to consume manual bolding and colons!
                cachedOpeningRegex = new RegExp(`^([\\s>\\-]*?(?:\\([a-zA-Z0-9(), -]+\\)\\s*)?)[\\*]*\\b(${wordsRegex})\\b[\\*:]*`, 'gmi');
            } else {
                cachedOpeningRegex = null;
            }
            lastBoldWords = appSettings.autoBoldWords;
        }

        if (cachedOpeningRegex) {
            return sanitizedText.replace(cachedOpeningRegex, (match, prefix, keyword, offset, fullStr) => {
                const lowerKey = keyword.toLowerCase();
                const colorVal = keywordColorMap[lowerKey];
                if (!colorVal) return match;

                const isBlockquote = prefix.includes('>');
                let formattedKey = keyword.toUpperCase();
                
                const remainder = fullStr.slice(offset + match.length);
                const firstNewlineIdx = remainder.indexOf('\n');
                const sameLineText = (firstNewlineIdx === -1 ? remainder : remainder.slice(0, firstNewlineIdx)).trim();
                
                const hasSameLineText = sameLineText.length > 0;
                const remainderHasColon = sameLineText.startsWith(':');
                const consumedColon = match.includes(':'); // Detect if the regex swallowed a colon

                // Smart Colon Injection
                if (consumedColon) {
                    formattedKey += ':';
                } else if (hasSameLineText && !remainderHasColon) {
                    formattedKey += ':';
                }

                if (isBlockquote) {
                    return `${prefix}<span class="bq-kw" data-color="${colorVal}">${formattedKey}</span>`;
                } else {
                    return `${prefix}<span style="background-color: color-mix(in srgb, ${colorVal} 12%, transparent); color: ${colorVal}; padding: 2px 6px; border-radius: 3px; font-weight: 700; font-size: 0.95rem;">${formattedKey}</span>`;
                }
            });
        }
        return sanitizedText;
    };

    window.postProcessHTML = function(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        doc.querySelectorAll('blockquote').forEach(bq => {
            const bqKw = bq.querySelector('.bq-kw');
            if (bqKw) {
                // ABWORD BLOCKQUOTES (PS_2)
                const colorVal = bqKw.getAttribute('data-color');
                
                bq.style.borderLeftColor = colorVal;
                bq.style.backgroundColor = `color-mix(in srgb, ${colorVal} 8%, transparent)`;

                bqKw.style.backgroundColor = 'transparent';
                bqKw.style.color = colorVal;
                bqKw.style.fontWeight = '700'; // Make the ABword explicitly bold
                bqKw.style.padding = '0';
            } else {
                // NORMAL BLOCKQUOTES
                const firstP = bq.querySelector('p');
                if (firstP) {
                    // Smart Regex: Bolds everything up to the first colon. 
                    // By stopping at the first '<', it safely ignores and respects manual markdown (**bold**) (PS_1)
                    firstP.innerHTML = firstP.innerHTML.replace(/^([^<]*?:)/, '<strong>$1</strong>');
                }
            }
        });

        return doc.body.innerHTML;
    };

    function renderPlainHTML(text) {

        }
        if (appSettings.excludedFaces.includes(paneFaces.right)) {
            paneFaces.right = getNextFace(paneFaces.right);
            if (activeTab === 'story' && currentlyDualPane) renderStoryFocus();
        }
		if (!appSettings.savedPaneFaces) appSettings.savedPaneFaces = { left: 0, right: 1 };
        appSettings.savedPaneFaces.left = paneFaces.left;
        appSettings.savedPaneFaces.right = paneFaces.right;
        saveSettings();
    };

    function getNextFace(currentFace) {
        if (totalFaces <= 1) return currentFace;
        let nextFace = (currentFace + 1) % totalFaces;
        let loopCount = 0;
        if (!appSettings.excludedFaces) appSettings.excludedFaces = [];
        
        while (appSettings.excludedFaces.includes(nextFace) && loopCount < totalFaces) {
            nextFace = (nextFace + 1) % totalFaces;
            loopCount++;
        }
        return nextFace;
    }

    window.handleSectionHeaderClick = function(el, e, side) {
        const rect = el.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const third = rect.width / 3;

        const sec = el.getAttribute('data-sec');
        const name = el.getAttribute('data-name');
        const itemIdx = parseInt(el.getAttribute('data-item-idx'));

		if (clickX < third) {
            const card = el.parentElement;
            const isCurrentlyExpanded = card.classList.contains('expanded');

            if (currentMode === 'focus') {
                if (!isCurrentlyExpanded) {
                    // ACCORDION: Close all other cards first
                    const allCards = card.parentElement.querySelectorAll('.story-card');
                    allCards.forEach(c => c.classList.remove('expanded'));
                    
                    // Open the clicked card and "lock" the subject
                    card.classList.add('expanded');
                    globalActiveSubject = subj; 
                } else {
                    // If you close the only open card, wipe the memory
                    card.classList.remove('expanded');
                    globalActiveSubject = null;
                }
                
                // NEW: Save the Focus Lock to Memory
                appSettings.lastActiveSubject = globalActiveSubject;

            }
            
            syncSmartToggleButton(side); updateIndexRow();

        else if (clickX >= third && clickX < (third * 2)) {
            navigator.clipboard.writeText(`${subj} | section ${sec} | ${name}`);
            const origBg = el.style.backgroundColor;
            el.style.backgroundColor = '#e8f8f5'; 
            setTimeout(() => el.style.backgroundColor = origBg, 250);
        } 
        else {
            if (totalFaces <= 1) return;
            
            const block = parsedBlocks[currentMode === 'quiz' ? quizOrder[quizPointer] : currentBlockIndex];
            const item = block.items[itemIdx];
            
            let localFace = parseInt(el.getAttribute('data-local-face'));
            localFace = getNextFace(localFace);
            el.setAttribute('data-local-face', localFace);

            const card = el.parentElement;
            
            // Check sync status and update the ghost indicator
            const globalFace = paneFaces[side] || 0;
            const indicator = el.querySelector('.face-indicator');

            if (localFace !== globalFace) {
                card.classList.add('out-of-sync');
            } else {
                card.classList.remove('out-of-sync');
            }

            let activeText = item.faces[localFace] || "";
            card.querySelector('.story-read-view').innerHTML = renderCardHTML(activeText, item, localFace);
            card.querySelector('.edit-story-box').value = activeText;

            const origBg = el.style.backgroundColor;
            el.style.backgroundColor = 'rgba(52, 152, 219, 0.1)';
            setTimeout(() => el.style.backgroundColor = origBg, 200);
            
            updateGlobalWordCount(side);
			scrollToTop();
        }
    };

// Global trackers for the Auto-Bold file
    let autoBoldSHA = null;
    let isAutoBoldDirty = false;

    async function fetchAutoBoldKeywords() {
        try {
            // Fetch from the root MAJOR folder
            const hdrs = { headers: { ...AUTH, "Accept": "application/vnd.github.v3+json" } };
            let res = await fetch(`${NOTES_API}/Auto_Bold_keywords.txt?cb=${Date.now()}`, hdrs), fromOld = false;
            if (!res.ok) { res = await fetch(`${NOTES_API}/${appSettings.basketName}/Auto_Bold_keywords.txt?cb=${Date.now()}`, hdrs); fromOld = res.ok; }   // old place: read only
            if (res.ok) {
                const fileData = await res.json();
                autoBoldSHA = fromOld ? null : fileData.sha;
                
                // Decode safely
                const binaryStr = atob(fileData.content.replace(/\n/g, ''));
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                
                const remoteText = new TextDecoder('utf-8').decode(bytes).trim();
                
                // Only overwrite and rebuild the UI if GitHub actually has different data
                if (appSettings.autoBoldWords !== remoteText) {
                    appSettings.autoBoldWords = remoteText;
                    saveSettings();
                    safeSetInput('setting-auto-bold', appSettings.autoBoldWords);
                    cachedOpeningRegex = null; 
                    loadTaxonomyBoard(); // Force the UI to instantly match GitHub
                }
                
                document.getElementById('auto-bold-sync-status').innerText = fromOld ? "Read from the old place; saves go to Notes/" : "Synced with GitHub";
            } else {
                document.getElementById("auto-bold-sync-status").innerText = "Local only (Will create on save)";
            }
        } catch (err) {
            console.warn("Auto_Bold_keywords.txt not found. It will be created on next save.");
            document.getElementById('auto-bold-sync-status').innerText = "Local only (Will create on save)";
        }
    }

    async function pushAutoBoldToGitHub() {
        if (!isAutoBoldDirty) return;
        const statusEl = document.getElementById('auto-bold-sync-status');
        if (statusEl) { statusEl.innerText = "Pushing to GitHub..."; statusEl.style.color = "var(--accent)"; }
        
        try {
            const endpoint = `${NOTES_API}/Auto_Bold_keywords.txt`;
            const utf8Bytes = new TextEncoder().encode(appSettings.autoBoldWords);
            let binaryStr = "";
            for (let i = 0; i < utf8Bytes.length; i++) binaryStr += String.fromCharCode(utf8Bytes[i]);
            const base64Content = btoa(binaryStr);

            const bodyPayload = {
                message: "Update Auto-Bold Keywords via District Learner",
                content: base64Content
            };
            if (autoBoldSHA) bodyPayload.sha = autoBoldSHA; // Update if exists, create if not

            const res = await fetch(endpoint, {
                method: 'PUT',
                headers: { ...AUTH, "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json" },
                body: JSON.stringify(bodyPayload)
            });

            if (!res.ok) throw new Error("Failed to write Auto-Bold file.");
            autoBoldSHA = (await res.json()).content.sha; 
            
            isAutoBoldDirty = false;
            if (statusEl) { statusEl.innerText = "saved to GitHub ✅"; statusEl.style.color = "var(--success)"; }
        } catch (err) {
            console.error(err);
            if (statusEl) { statusEl.innerText = "Sync Failed ⚠️"; statusEl.style.color = "var(--danger)"; }
        }
    }

    // ===== DATA LAYER =====
    // Faces: notes/<basket>/<basket>_stories.txt (face 0) + every numbered folder in notes/<basket>/ (one face each).
    // Every face file holds sections: "CODE N > Title.:" then the text. Files of one folder are shown in file-number order.
    // Names: geography_quiz/<basket>/<state folder>/names.txt (column 1 = number, column 2 = English name). Read only, never written.
    const GH_HEADERS = { ...AUTH, "Accept": "application/vnd.github.v3+json" };
    let faceDefs = [];
    let subjCodes = [];
    let rankOf = {};

    function encPath(p) { return p.split('/').map(encodeURIComponent).join('/'); }

    async function ghGet(url, fresh = true) {
        const r = await fetch(fresh ? url + (url.includes('?') ? '&' : '?') + 'cb=' + Date.now() : url, { cache: 'no-store', headers: GH_HEADERS });
        if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
        return r.json();
    }

    async function listDir(path) {
        try { const a = await ghGet(`${REPO_API}/contents/${encPath(path)}`); return Array.isArray(a) ? a : []; }
        catch (e) { if (e.status === 404) return []; throw e; }
    }

    function b64ToText(b64) {
        const bin = atob(b64.replace(/\s/g, ''));
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
    }

    function textToB64(text) {
        const bytes = new TextEncoder().encode(text);
        let bin = "";
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
    }

    async function readFileText(entry) {
        const j = await ghGet(`${REPO_API}/git/blobs/${entry.sha}`, false);
        return b64ToText(j.content);
    }

    function prefixNum(name) { const m = name.match(/^(\d+)/); return m ? parseInt(m[1], 10) : Infinity; }
    function byPrefix(a, b) { return (prefixNum(a.name) - prefixNum(b.name)) || a.name.localeCompare(b.name, undefined, { numeric: true }); }

    function normNum(n) { return String(n).trim().toUpperCase().replace(/^0+(?=\d)/, ''); }
    function splitNum(n) { const m = n.match(/^(\d+)(.*)$/); return m ? { int: parseInt(m[1], 10), suf: m[2] } : { int: Infinity, suf: n }; }
    function cmpNum(a, b) { const x = splitNum(a), y = splitNum(b); return (x.int - y.int) || (x.suf < y.suf ? -1 : x.suf > y.suf ? 1 : 0); }

    // ---- section parser: header line "CODE N > Title.:" (text on the next lines) or "CODE N > Title: text" ----
    const HDR_RE = /^([A-Z]+) (\d+[A-Za-z]*)\s*>\s?(.*)$/;
    const HINT_RE = /^\s*\(\s*(\d+[A-Za-z]*)\s*:\s*(.*)\)\s*$/;   // district line: (11 : Kupwara)
    function parseSections(text) {
        const out = []; out.hints = {}; let cur = null;
        text.replace(/^\uFEFF/, '').split(/\r\n|\n|\r/).forEach(line => {
            const m = line.match(HDR_RE);
            if (m) {
                const rest = m[3].trim(); let title = rest, body = "";
                if (rest.endsWith(':')) title = rest.slice(0, -1).trim();
                else { const c = rest.indexOf(':'); if (c !== -1) { title = rest.slice(0, c).trim(); body = rest.slice(c + 1).trim(); } }
                cur = { code: m[1], num: normNum(m[2]), title, lines: body ? [body] : [] };
                out.push(cur); return;
            }
            const h = line.match(HINT_RE);
            if (h) { out.hints[normNum(h[1])] = h[2].trim(); return; }
            if (!cur) return;
            if (/^_{3,}/.test(line.trim()) || /^###/.test(line)) return; // old-format leftovers
            cur.lines.push(line);
        });
        out.forEach(s => {
            while (s.lines.length && !s.lines[s.lines.length - 1].trim()) s.lines.pop();
            while (s.lines.length && !s.lines[0].trim()) s.lines.shift();
            s.text = s.lines.join('\n');
        });
        return out;
    }

    // ---- names.txt parser: column 1 = number, column 2 = English name; "//" lines skipped ----
    function parseNames(text) {
        const rows = [];
        text.replace(/^\uFEFF/, '').split(/\r\n|\n|\r/).forEach(line => {
            if (!line.trim() || line.trim().startsWith('//')) return;
            const m = line.match(/^\s*(\d+(?:\.\d+)?[A-Za-z]*)\s*(?:[\t|;,:]|\s-\s|\s+|$)\s*(.*)$/);
            if (!m) return;
            rows.push({ num: m[1], name: m[2].split(/[\t|;,]/)[0].trim() });
        });
        return rows;
    }

    async function loadDistrictNames(basket) {
        const nameOf = {}; const ranges = [];
        try {
            const dirs = (await listDir(`${MAPS_ROOT}/${basket}`)).filter(d => d.type === 'dir');
            const states = dirs.map(d => {
                const m = d.name.match(/^(\d+(?:\.\d+)?)[\s_.-]*(.*)$/);
                return { entry: d, order: m ? parseFloat(m[1]) : 1e9, sub: !!(m && m[1].includes('.')), label: (m && m[2]) ? m[2] : d.name };
            }).filter(s => !s.sub).sort((a, b) => (a.order - b.order) || a.entry.name.localeCompare(b.entry.name, undefined, { numeric: true }));
            const texts = await Promise.all(states.map(async s => {
                try { const j = await ghGet(`${REPO_API}/contents/${encPath(s.entry.path)}/names.txt`); return j.content ? b64ToText(j.content) : ""; }
                catch (e) { if (e.status === 404) return ""; throw e; }
            }));
            const usedLabels = new Set();
            states.forEach((s, i) => {
                const ints = [];
                parseNames(texts[i]).forEach(r => {
                    if (r.num.includes('.') || /^0+$/.test(r.num)) return;   // decimal children and "00" (no number) are not section slots
                    const n = normNum(r.num);
                    if (!Object.prototype.hasOwnProperty.call(nameOf, n) || (!nameOf[n] && r.name)) nameOf[n] = r.name;
                    if (/^\d+$/.test(n)) ints.push(parseInt(n, 10));
                });
                if (ints.length) {
                    let label = s.label; if (usedLabels.has(label)) label = s.entry.name; usedLabels.add(label);
                    ranges.push({ label, lo: Math.min(...ints), hi: Math.max(...ints) });
                }
            });
        } catch (err) { console.warn("District names could not be loaded:", err); }
        return { nameOf, ranges };
    }

    function mkFile(entry) {
        return { path: entry.path, name: entry.name, sha: entry.sha, rank: prefixNum(entry.name),
                 hint: ((entry.name.match(/^\d+[_\s.-]*([A-Za-z]+)/) || [])[1] || "").toUpperCase(),
                 baseline: "", virtual: false, sections: [], codes: [] };
    }

    function storiesIdx() { return faceDefs.findIndex(f => f.kind === 'stories'); }
    function mainFace() { const i = faceDefs.findIndex(f => f.kind === 'folder'); return i === -1 ? 0 : i; }

    async function fetchBasketFolder(basket) {
        try {
            // 1. Faces
            const baseList = await listDir(`${NOTES_ROOT}/${basket}`);
            const storiesEntry = baseList.find(f => f.type === 'file' && /_stories\.txt$/i.test(f.name)) || null;
            const folders = baseList.filter(f => f.type === 'dir' && /^\d/.test(f.name)).sort(byPrefix);
            const storiesFace = { label: 'stories', kind: 'stories', path: `${NOTES_ROOT}/${basket}`, newName: `${basket}_stories.txt`, files: storiesEntry ? [mkFile(storiesEntry)] : [] };
            faceDefs = [];
            const folderLists = await Promise.all(folders.map(f => listDir(f.path)));
            folders.forEach((f, i) => faceDefs.push({
                label: f.name.replace(/^\d+[_\s.-]*/, '') || f.name, kind: 'folder', path: f.path,
                files: folderLists[i].filter(x => x.type === 'file' && /^\d.*\.txt$/i.test(x.name)).sort(byPrefix).map(mkFile)
            }));
            faceDefs.push(storiesFace);                 // order of work: main, notes, then stories
            totalFaces = faceDefs.length;

            // 2. Read every file and the district names together
            const allFiles = faceDefs.flatMap(f => f.files);
            // index files (.md): in an "index" folder of the basket, or beside the main files
            const idxDir = baseList.find(f => f.type === 'dir' && f.name.toLowerCase() === 'index');
            const idxList = idxDir ? await listDir(idxDir.path) : [];
            const mdEntries = [...idxList, ...folderLists.flat()].filter(x => x.type === 'file' && /\.md$/i.test(x.name));
            const [texts, names, idxTexts] = await Promise.all([Promise.all(allFiles.map(readFileText)), loadDistrictNames(basket), Promise.all(mdEntries.map(readFileText))]);
            allFiles.forEach((f, i) => {
                f.sections = parseSections(texts[i]);
                f.codes = [...new Set(f.sections.map(s => s.code))];
                if (!f.codes.length && f.hint) f.codes = [f.hint];
            });

            // 3. Sections per face
            const secMap = faceDefs.map(() => new Map());
            const seenCodes = []; rankOf = {};
            faceDefs.forEach((face, fi) => face.files.forEach(file => {
                file.sections.forEach(s => {
                    if (s.title.toUpperCase() === 'NONE' && !s.text) return;
                    const key = `${s.code} ${s.num}`;
                    if (!secMap[fi].has(key)) secMap[fi].set(key, { title: s.title, text: s.text, file });
                    if (!seenCodes.includes(s.code)) seenCodes.push(s.code);
                });
                if (face.kind === 'folder') file.codes.forEach(c => { if (rankOf[c] === undefined || file.rank < rankOf[c]) rankOf[c] = file.rank; });
            }));
            // File-number prefixes decide the order; a subject without a file takes its place from the order in which it first appears (stories first)
            const posOf = (c) => rankOf[c] ?? (seenCodes.indexOf(c) + 1);
            subjCodes = seenCodes.slice().sort((a, b) => (posOf(a) - posOf(b)) || (seenCodes.indexOf(a) - seenCodes.indexOf(b)));

            // 4. Slots = every district number + every section number, in number order
            const slotSet = new Set(Object.keys(names.nameOf));
            secMap.forEach(m => m.forEach((v, key) => slotSet.add(key.split(' ')[1])));
            const slots = [...slotSet].sort(cmpNum);
            if (!slots.length) throw new Error(`No sections found in ${NOTES_ROOT}/${basket}`);

            const hints = {};
            faceDefs.forEach(face => { if (face.kind === 'stories') face.files.forEach(f => Object.assign(hints, f.sections.hints)); });
            const chapterOf = (num) => { const i = splitNum(num).int; const r = names.ranges.find(r => i >= r.lo && i <= r.hi); return r ? r.label : 'No map'; };
            const mf = mainFace();
            masterBlocks = slots.map(num => {
                const items = subjCodes.map(code => {
                    const key = `${code} ${num}`;
                    const texts = [], titles = [], has = [], fileOf = [];
                    faceDefs.forEach((_, fi) => {
                        const e = secMap[fi].get(key);
                        texts[fi] = e ? e.text : ""; titles[fi] = e ? e.title : ""; has[fi] = !!e; fileOf[fi] = e ? e.file : null;
                    });
                    const name = titles[mf] || titles.find(t => t) || 'NONE';
                    return { subjNum: key, name, faces: texts, titles, has, fileOf };
                });
                // hintState: 'stored' = the file has a district line, 'none' = a story exists without one (never compared), 'new' = no story yet (the line is written with the first story)
                const hasHint = Object.prototype.hasOwnProperty.call(hints, num);
                const hintState = hasHint ? 'stored' : (items.some(i => i.has[storiesIdx()]) ? 'none' : 'new');
                return { headers: [{ num, letters: "", word: names.nameOf[num] || "" }], items, chapter: chapterOf(num), hint: hints[num], hintState };
            });
            const usedCh = new Set(masterBlocks.map(b => b.chapter));
            availableChapters = names.ranges.map(r => r.label).filter(l => usedCh.has(l));
            if (usedCh.has('No map')) availableChapters.push('No map');
            faceDefs.forEach((face, fi) => face.files.forEach(file => { file.baseline = serializeFile(fi, file); }));
            buildIndexes(mdEntries, idxTexts);

            // 5. Saved chapter and face choices
            const savedChapters = appSettings.activeChaptersByBasket[appSettings.basketName];
            activeChapters = savedChapters ? new Set(savedChapters.filter(ch => availableChapters.includes(ch))) : new Set();
            if (!appSettings.excludedFaces) appSettings.excludedFaces = [];
            const getValidFace = (desired) => {
                if (desired < totalFaces && !appSettings.excludedFaces.includes(desired)) return desired;
                for (let i = 0; i < totalFaces; i++) if (!appSettings.excludedFaces.includes(i)) return i;
                return 0;
            };
            if (appSettings.faceOrder !== 2) { appSettings.savedPaneFaces = { left: 0, right: 1 }; appSettings.excludedFaces = []; appSettings.faceOrder = 2; saveSettings(); }   // faces are now main, notes, stories
            if (!appSettings.savedPaneFaces) appSettings.savedPaneFaces = { left: 0, right: 1 };
            paneFaces = { left: getValidFace(appSettings.savedPaneFaces.left), right: getValidFace(appSettings.savedPaneFaces.right) };
            renderChapterTags();
            renderFaceExclusionToggles();
            applyFiltersAndRender(true);
            updateAffectedUI();
        } catch (error) {
            const bar = document.getElementById('top-status-bar');
            bar.innerHTML = `⚠️ ${error.message}`; bar.style.background = 'var(--danger)';
        }
    }

    // ---- writing: one file = its sections in number order ----
    function serializeFile(fi, file) {
        const face = faceDefs[fi]; const groups = [];
        masterBlocks.forEach(block => {
            const lines = [];
            block.items.forEach(item => {
                if (item.fileOf[fi] !== file) return;
                const text = (item.faces[fi] || "").replace(/\r\n?/g, '\n').replace(/^\n+/, '').replace(/\s+$/, '');
                if (!item.has[fi] && !text) return;
                const title = item.titles[fi] || (item.name === 'NONE' ? "" : item.name);
                lines.push(`${item.subjNum} > ${title}:` + (text ? '\n' + text : ''));
            });
            if (lines.length && face.kind === 'stories') {
                const h = block.hintState === 'stored' ? block.hint : (block.hintState === 'new' ? block.headers[0].word : null);
                if (h !== null) lines.unshift(`(${block.headers[0].num} : ${h})`);
            }
            if (lines.length) groups.push(face.kind === 'stories' ? lines.join('\n') : lines.join('\n\n'));
        });
        return groups.length ? groups.join('\n\n') + '\n' : "";
    }

    function resolveFile(fi, code) {
        const face = faceDefs[fi];
        if (face.kind === 'stories') {
            if (!face.files.length) face.files.push({ path: `${face.path}/${face.newName}`, name: face.newName, sha: null, rank: 0, hint: "", baseline: "", virtual: true, sections: [], codes: [] });
            return face.files[0];
        }
        let f = face.files.find(x => x.codes.includes(code));
        if (f) return f;
        const rank = rankOf[code] ?? (subjCodes.indexOf(code) + 1);
        const name = `${rank}_${code}_${face.label.replace(/\s+/g, '_')}.txt`;
        f = { path: `${face.path}/${name}`, name, sha: null, rank, hint: code, baseline: "", virtual: true, sections: [], codes: [code] };
        face.files.push(f); face.files.sort(byPrefix);
        return f;
    }

function renderChapterTags() {
        const container = document.getElementById('chapter-tags-container');
        if (availableChapters.length === 1 && availableChapters[0] === "All Sections") { container.innerHTML = '<span style="color:#888; font-size:0.85rem;">No chapters found.</span>'; return; }
        const btns = availableChapters.map(ch => {
            const btn = document.createElement('button'), cov = chapterCoverage(ch);
            btn.innerHTML = ch.replace(/</g, '&lt;') + (cov ? `<i class="cov" title="${cov}% of this state has notes"><b style="width:${cov}%"></b></i>` : '');
            btn.title = cov ? `${cov}% of this state has notes` : 'Show or hide this state';
            btn.className = activeChapters.has(ch) ? 'tag-btn active' : 'tag-btn'; btn.onclick = () => toggleChapter(ch, btn); return btn;
        });
        buildSegGroup(container, 'Chapters', btns, window.innerWidth < 560 ? 4 : 6, '<br><u title="Select or clear all chapters" onclick="toggleAllChapters()">all</u>');
    }

    function toggleChapter(ch, btnElement) {
		if (dailyTargetActive) toggleDailyTarget();
        if (activeChapters.has(ch)) { activeChapters.delete(ch); btnElement.classList.remove('active'); } 
        else { activeChapters.add(ch); btnElement.classList.add('active'); }
        saveChapters(); 
        if(activeChapters.size > 0) applyFiltersAndRender(false);
        else { document.getElementById('peg-tbody').innerHTML = ""; document.querySelectorAll('.story-cards-container').forEach(c => c.innerHTML = ""); }
    }

	function applyFiltersAndRender(isHardReset = false) {
        parsedBlocks = masterBlocks.filter(b => activeChapters.has(b.chapter));
        
        // NEW MEMORY LOGIC: Restore memory if valid, otherwise reset to 0
        if (appSettings.lastBlockIndex !== undefined && appSettings.lastBlockIndex < parsedBlocks.length) {
            currentBlockIndex = appSettings.lastBlockIndex;
        } else {
            currentBlockIndex = 0;
        }
        
        document.getElementById('top-status-bar').innerHTML = ""; 
        renderTable();
        
        if (isHardReset) { 
            setAppMode(appSettings.mode, false); 
            if (activeTab === appSettings.defaultView) {
                if (activeTab === 'table') setTableHeaderMode();
                else { renderStoryFocus(); scrollToTop(); }
            } else {
                switchTabLogicOnly(appSettings.defaultView); 
            }
        } else {
            if (appSettings.mode === 'quiz') setAppMode('quiz', false); 
            else { 
                if (appSettings.defaultView === 'story') { renderStoryFocus(); scrollToTop(); } 
                else setTableHeaderMode(); 
            }
        }
    }

    function setAppMode(mode, autoSwitch = false) {
        if (currentMode !== 'quiz' && mode === 'quiz') preQuizBlockIndex = currentBlockIndex;
        else if (currentMode === 'quiz' && mode !== 'quiz') currentBlockIndex = preQuizBlockIndex;

        // NEW FIX: If leaving Focus Mode, automatically clear any active target
        if (currentMode === 'focus' && mode !== 'focus' && dailyTargetActive) {
            dailyTargetActive = false;
            dailyTargetParams = {};
            targetSectionName = "";
            totalTargetWords = 0;
        }

        appSettings.mode = mode; currentMode = mode; saveSettings();
        
        if (mode === 'quiz' && parsedBlocks.length > 0) {
            quizRound = 1; quizPointer = -1; lastItemFromPrevRound = null;
            quizOrder = getShuffledArray(parsedBlocks.length); nextQuizOrder = getShuffledArray(parsedBlocks.length);
            if (nextQuizOrder[0] === quizOrder[quizOrder.length - 1]) [nextQuizOrder[0], nextQuizOrder[1]] = [nextQuizOrder[1], nextQuizOrder[0]];
        }
        
        if (autoSwitch && activeTab !== 'story') switchTabLogicOnly('story');
        else {
            if (activeTab === 'story') { renderStoryFocus(); scrollToTop(); }
            else setTableHeaderMode();
        }
    }

    function getShuffledArray(length) {
        let arr = Array.from({length}, (_, i) => i);
        for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        return arr;
    }

    function flashRoundWatermark() {
        const flash = document.getElementById('round-flash');
        flash.innerText = `ROUND ${quizRound}`; flash.classList.add('flash-active');
        setTimeout(() => { flash.classList.remove('flash-active'); }, 1200);
    }

    function updateQuizProgressBar() {
        if (currentMode === 'quiz' && parsedBlocks.length > 0) document.getElementById('quiz-progress').style.width = Math.max(0, ((quizPointer + 1) / parsedBlocks.length) * 100) + '%';
        else document.getElementById('quiz-progress').style.width = '0%';
    }

	function setTableHeaderMode() {
        const bar = document.getElementById('top-status-bar'); 
        if (!bar) return;
        bar.style.background = ''; 
        bar.className = 'header-mode';
        
        const isFocusIndex = (currentMode === 'focus' && globalActiveSubject !== null);
        const labelWrd = isFocusIndex ? globalActiveSubject : "KEYWORD";
        
        // Calculate the accurate total row count for the display indicator
        let displayCount = 0;
        if (isFocusIndex) {
            parsedBlocks.forEach(block => {
                block.items.forEach(item => {
                    const subjCode = item.subjNum.split(' ')[0] || "LAW";
                    if (subjCode === globalActiveSubject) {
                        if (!(!appSettings.showNoneSubjects && item.name.trim().toUpperCase() === 'NONE')) {
                            displayCount++;
                        }
                    }
                });
            });
        } else {
            parsedBlocks.forEach(block => displayCount += block.headers.length);
        }

        bar.innerHTML = `<div style="display:flex; width:100%; height:100%; align-items:center; justify-content: space-between;"><div class="hdr-col col-num">NUM (${displayCount})${covPctHtml()}${(!isFocusIndex && affectedBlocks().length) ? `<span class="hdr-badge" title="Stories written for another district name">${affectedBlocks().length}</span>` : ''}</div><div class="hdr-col col-wrd interactive-hdr" id="hdr-words" onclick="toggleColumn('words')">${labelWrd}</div></div>${covLineHtml()}<div id="quiz-progress"></div>`;
        updateQuizProgressBar();
        updateIndexRow();
    }

    function setStoryHeaderMode(headers, prevNum, nextNum) {
        const bar = document.getElementById('top-status-bar'); bar.style.background = ''; bar.className = 'story-header-mode'; const aff = affInfo(masterBlocks.find(b => b.headers === headers)); 
        
        const prevText = prevNum ? prevNum : '--';
		
		// Minimal Visual Indicator: Thicker, darker border and darker text when in Focus Mode
        //const isFocus = currentMode === 'focus';
        //const circleStyle = isFocus 
        //    ? 'border: 2px solid rgba(44, 62, 80, 0.6); color: rgba(44, 62, 80, 0.9); font-weight: 900;' 
        //    : '';		

		const prevHtml = `<div class="top-ghost-circle interactive-circle" onclick="toggleFocusMode()" title="Toggle Focus Mode">${prevText}</div>`;
        const nextText = nextNum ? nextNum : '--';
        const nextHtml = `<div class="top-ghost-circle interactive-circle" onclick="if(window.innerWidth > 1024) toggleDualPaneGlobal(event)" title="Toggle Split View (Desktop)">${nextText}</div>`;

                <span class="story-hdr-text ${sizeClass} truncate" style="font-weight: 900; color: var(--accent);">${headers[0].num}</span>
                <span class="story-hdr-text ${sizeClass} truncate" style="font-weight: 800; color: var(--primary);">${headers[0].word.toUpperCase()}</span>${aff ? `<span class="aff-tag" title="Story was written for ${affShow(aff.was)}">⚠ <s>${affShow(aff.was)}</s></span>` : ''}
            </div>`;
        } else {
            const numsStr = headers.map(h => h.num).join(', '); const wordsStr = headers.map(h => h.word.toUpperCase()).join(', ');
            const sizeClass = Math.max(numsStr.length, wordsStr.length) > 35 ? 'xs' : 'sm'; 
            centerContentHtml = `
            <div class="story-center-header" onclick="handleMainHeaderCopy()" style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; padding: 0 10px; gap: 2px; transform: translateY(var(--notch-offset, 0px)); transition: transform 0.2s;">
                <div class="story-hdr-text ${sizeClass} truncate" style="font-weight: 900; color: var(--accent); width: 100%;">${numsStr}</div>
                <div class="story-hdr-text ${sizeClass} truncate" style="font-weight: 800; color: var(--primary); width: 100%;">${wordsStr}</div>
            </div>`;
        }
        
        bar.innerHTML = `<div style="display:flex; width:100%; height:100%;"><div style="width: 55px; display: flex; justify-content: flex-start; padding-left: 15px; align-items: center; flex-shrink: 0;">${prevHtml}</div>${centerContentHtml}<div style="width: 55px; display: flex; justify-content: flex-end; padding-right: 15px; align-items: center; flex-shrink: 0;">${nextHtml}</div></div>${covLineHtml()}<div id="quiz-progress"></div>`;
        bar.classList.toggle('aff-bar', !!aff);
        updateIndexRow();
    }

    function toggleColumn(colName) { document.getElementById('app').classList.toggle(`hide-${colName}`); }

    function syncUnsavedEdits(side) {
        if (!document.body.classList.contains('dev-mode-on')) return;
        const block = parsedBlocks[currentMode === 'quiz' ? quizOrder[quizPointer] : currentBlockIndex];
        const container = document.getElementById(`story-cards-container-${side}`);
        if (!container) return;
        container.querySelectorAll('.story-card').forEach(card => { 
            const header = card.querySelector('.story-card-header');
            if (!header) return;
            const idx = parseInt(header.getAttribute('data-item-idx'));
            const localFace = parseInt(header.getAttribute('data-local-face'));
            const editBox = card.querySelector('.edit-story-box'); 
            if (editBox && block.items[idx]) {
                block.items[idx].faces[localFace] = editBox.value; 
            }
        });
    }

	function renderTable() {
        const tbody = document.getElementById('peg-tbody'); 
        if (!tbody) return;
        tbody.innerHTML = "";
        if (parsedBlocks.length === 0) return;
        
        const isFocusIndex = (currentMode === 'focus' && globalActiveSubject !== null);
        
        parsedBlocks.forEach((block, blockIdx) => {
            if (isFocusIndex) {
                // FOCUS MODE INDEX: Render items matching the active subject lock
                block.items.forEach(item => {
                    if (!appSettings.showNoneSubjects && item.faces[0].trim() === "") return;
					
                    const subjCode = item.subjNum.split(' ')[0] || "LAW";
                    if (subjCode === globalActiveSubject) {
                        const secNum = item.subjNum.substring(subjCode.length).trim() || item.subjNum;
                        
                        const tr = document.createElement('tr');
                        tr.onclick = () => {
                            currentBlockIndex = blockIdx;
                            appSettings.lastBlockIndex = currentBlockIndex; // NEW: Save memory
                            saveSettings(); // NEW: Save memory
                            switchTabLogicOnly('story');
                        };
                        tr.innerHTML = `<td class="td-num col-num">${secNum}</td><td class="td-focus-word col-wrd">${item.name}</td>`;
                        tbody.appendChild(tr);
                    }
                });
            } else {
                // DEFAULT INDEX: Render standard District Keywords
                block.headers.forEach(header => {
                    const tr = document.createElement('tr');
                    tr.onclick = () => {
                        currentBlockIndex = blockIdx;
                        appSettings.lastBlockIndex = currentBlockIndex; // NEW: Save memory
                        saveSettings(); // NEW: Save memory
                        if (currentMode === 'quiz') {
                            const foundIdx = quizOrder.indexOf(blockIdx);
                            if (foundIdx !== -1) quizPointer = foundIdx;
                        }
                        switchTabLogicOnly('story');
                    };
                    const aff = affInfo(block);

	async function pushToGitHub(side) {

        const saveBtn = document.querySelector(`#bottom-bar-${side} .btn-save`);
        try {
            // 1. Take over what is typed in the open cards
            const block = parsedBlocks[currentMode === 'quiz' ? quizOrder[quizPointer] : currentBlockIndex];

                });
            });

            // 2. Find the files whose content changed
            const jobs = [];
            faceDefs.forEach((face, fi) => {
                masterBlocks.forEach(b => b.items.forEach(item => {
                    if (!item.fileOf[fi] && (item.faces[fi] || "").trim()) item.fileOf[fi] = resolveFile(fi, item.subjNum.split(' ')[0]);
                }));
                face.files.forEach(file => {

            } else {

                for (let n = 0; n < jobs.length; n++) {
                    const { fi, file, content } = jobs[n];
                    bar.innerHTML = `<span id="status-text">☁️ Writing ${file.name} (${n + 1}/${jobs.length})...</span>`;
                    const body = { message: `Update ${file.name} via District Learner`, content: textToB64(content) };
                    if (file.sha) body.sha = file.sha;
                    const res = await fetch(`${REPO_API}/contents/${encPath(file.path)}`, {

                    masterBlocks.forEach(b => b.items.forEach(item => {
